<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Floor — Picture Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--card:#151924;--card2:#1f2533;--line:#2a3142;--text:#f4f5f8;--muted:#98a1b3;--accent:#ffc933;--accent2:#ff8a3d;--ok:#3ddc97;--bad:#ff5c7a;--blue:#5aa2ff;--disp:"Anton",Impact,"Arial Narrow Bold",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--card2);transition:transform .12s,filter .15s,box-shadow .2s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#141414}
kbd{font:inherit;font-size:12px;font-weight:800;border:1.5px solid currentColor;border-radius:5px;padding:0 6px;opacity:.75}

/* Backdrop: glow blobs + moving floor grid */
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;z-index:0}
.glow.a{background:var(--accent);top:-30vmax;left:-20vmax;animation:drift 16s ease-in-out infinite alternate}
.glow.b{background:var(--blue);bottom:-34vmax;right:-22vmax;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
.floor{position:fixed;left:-60%;right:-60%;bottom:0;height:52vh;transform:perspective(520px) rotateX(64deg);transform-origin:bottom;background-image:linear-gradient(#ffc93355 2px,transparent 2px),linear-gradient(90deg,#ffc93355 2px,transparent 2px);background-size:96px 96px;animation:floorMove 5s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);opacity:.45;pointer-events:none;z-index:0}
@keyframes floorMove{to{background-position:0 96px}}
body.playing .floor{display:none}
body.playing .glow{opacity:.1}

/* Home */
#home{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:36px 16px 56px}
.brand{display:flex;gap:10px;align-items:center;justify-content:center;font-size:13px;letter-spacing:.34em;color:var(--muted);font-weight:800}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand i b{width:7px;height:7px;border-radius:2px;background:var(--line);animation:tile 2.4s infinite}
.brand i b:nth-child(2){animation-delay:.2s}.brand i b:nth-child(4){animation-delay:.5s}.brand i b:nth-child(5){animation-delay:.8s}.brand i b:nth-child(6){animation-delay:1.1s}.brand i b:nth-child(8){animation-delay:1.4s}.brand i b:nth-child(9){animation-delay:1.7s}.brand i b:nth-child(3){animation-delay:2s}
@keyframes tile{0%,60%,100%{background:var(--line)}20%{background:var(--accent);box-shadow:0 0 8px var(--accent)}}
h1{font-family:var(--disp);font-size:clamp(46px,10vw,104px);line-height:.95;margin:14px 0 30px;text-align:center;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
h1 span{display:block;background:linear-gradient(90deg,var(--accent),#fff3bf,var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3.5s linear infinite}
.card{background:#151924cc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card h2{font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0 0 12px;font-weight:800}
.players{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs{font-family:var(--disp);font-size:22px;color:#141414;background:linear-gradient(135deg,var(--accent),var(--accent2));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;animation:vs 2.2s ease-in-out infinite}
@keyframes vs{50%{transform:scale(1.12) rotate(-6deg);box-shadow:0 0 24px #ffc93370}}
input[type=text],select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0c12;font-size:17px;font-weight:600;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 4px #ffc93322;outline:0}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
.opts label{display:flex;align-items:center;gap:8px}
.opts select{width:auto;padding:8px 10px;font-size:15px}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.topic{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;padding:0;border:2px solid transparent;text-align:left;background:linear-gradient(135deg,var(--g1,#2a3350),var(--g2,#151924));transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.topic .em{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;padding-bottom:24px;transition:transform .3s}
.topic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:0;transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
.topic img.ok{opacity:1}
.topic:hover{transform:translateY(-4px);box-shadow:0 14px 30px #000a;filter:none!important}
.topic:hover img{transform:scale(1.1)}
.topic:hover .em{transform:scale(1.2) rotate(-6deg)}
.topic .lab{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,#000e);color:#fff;font-weight:800;font-size:15px;line-height:1.15}
.topic .lab small{display:block;font-weight:600;color:#ffffffb0;font-size:12px;margin-top:2px}
.topic[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 4px #ffc93330,0 14px 34px #000b;transform:translateY(-4px)}
.topic[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#141414;display:grid;place-items:center;font-weight:900;font-size:15px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.start{position:relative;overflow:hidden;width:100%;font-family:var(--disp);font-weight:400;letter-spacing:.06em;font-size:26px;padding:16px;margin-top:4px;border-radius:16px;box-shadow:0 10px 30px #ffc93330}
.start::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff90,transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.start:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 16px 40px #ffc93355}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.row button{font-weight:600;font-size:14px;padding:10px 14px}
.keys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}

/* Game */
#game{position:relative;z-index:1;display:none;height:100vh;height:100dvh;padding:14px;gap:14px;grid-template-columns:minmax(0,1fr) 330px}
.stage{display:flex;flex-direction:column;min-height:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:6px;font-weight:800;letter-spacing:.04em}
#topicName{color:var(--accent);text-transform:uppercase;letter-spacing:.14em}
.progress{height:5px;border-radius:9px;background:var(--card2);overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.photo{flex:1;min-height:220px;background:#000;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--line)}
#backdrop{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.45) saturate(1.3);transition:background-image .4s;transform:scale(1.1)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;filter:drop-shadow(0 10px 30px #000a)}
#maskLayer{position:absolute;inset:0;pointer-events:none;z-index:2}
.cover{position:absolute;background:#000;display:flex;align-items:center;justify-content:center;color:#ffffff40;font-weight:900;font-size:clamp(14px,2vw,26px)}
.cover.blur{background:rgba(255,255,255,.12);-webkit-backdrop-filter:var(--b);backdrop-filter:var(--b);color:transparent}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;opacity:0;box-shadow:inset 0 0 90px 10px #ff5c7ab0;transition:opacity .3s}
#vignette.on{animation:danger 1s ease-in-out infinite}
@keyframes danger{0%,100%{opacity:.25}50%{opacity:1}}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:3}
.overlay.show{display:flex}
#loading{background:#000a;color:var(--muted);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pausedCover{background:#06080ef5;font-family:var(--disp);font-size:clamp(40px,8vw,90px);letter-spacing:.12em;color:var(--accent);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{letter-spacing:.2em;opacity:.7}}
#count{z-index:6;background:radial-gradient(circle,#1b2233,#06080e 75%);font-family:var(--disp);font-size:clamp(120px,30vw,320px);color:var(--accent);line-height:1}
#count.tick span{display:block;animation:countIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes countIn{0%{transform:scale(2.6);opacity:0;filter:blur(12px)}35%{transform:scale(1);opacity:1;filter:none}80%{transform:scale(.96);opacity:1}100%{transform:scale(.7);opacity:0}}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #ffffff25;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#answer{position:absolute;left:0;right:0;bottom:0;padding:26px 20px 22px;background:linear-gradient(transparent,#000f 50%);text-align:center;font-family:var(--disp);font-size:clamp(28px,5vw,56px);letter-spacing:.02em;color:var(--accent);display:none;z-index:4}
#answer small{display:block;font-family:"Outfit",sans-serif;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.2em;margin-bottom:4px}
#textCard{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:4%;font-family:var(--disp);color:var(--accent);letter-spacing:.06em;line-height:1;font-size:clamp(70px,16vw,280px);word-break:break-word;background:radial-gradient(circle at 50% 40%,#232b40,#0a0c12 75%);text-shadow:0 0 60px #ffc93350}
#textCard.show{display:flex}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;animation:rise .5s .1s cubic-bezier(.2,.8,.2,1) both}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px}
.player{position:relative;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 10px 10px;text-align:center;transition:border-color .25s,transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,box-shadow .3s}
.player:not(.active){opacity:.55;transform:scale(.96)}
.player.active{border-color:var(--accent);box-shadow:0 0 34px #ffc93333;animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{50%{box-shadow:0 0 46px #ffc93366}}
.player b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:800}
.timer{font-family:var(--disp);font-size:clamp(40px,4vw,58px);font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.player.active .timer.low{animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:4px 6px 8px}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:var(--ok);transition:width .15s linear,background .3s}
.bar i.low{background:var(--bad)}
.score{display:inline-block;color:var(--ok);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.score small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-left:5px}
.score.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.5)}}
.host{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;text-align:center;color:var(--muted);font-size:14px;transition:border-color .2s,color .2s}
.host.open{border-color:var(--accent);color:var(--accent);font-size:clamp(20px,3vw,26px);font-weight:800;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.host small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.controls{display:grid;gap:8px}
.controls button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px;border-radius:14px}
.correct{background:linear-gradient(135deg,#3ddc97,#22b877);color:#06281a;font-size:17px}
.pass{background:#e9ecf2;color:#141414;font-size:17px}
.end{background:transparent;border:1px solid #ff5c7a80!important;color:var(--bad)}
.controls button.hit{transform:scale(.95);filter:brightness(1.35)}
.notice{text-align:center;min-height:20px;color:var(--muted);font-size:13px}
@media(max-width:900px){#game{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:auto}.stage{height:56vh;height:56dvh;min-height:300px}.controls{grid-template-columns:1fr 1fr}.side{overflow:visible}}
@media(max-width:520px){.players{grid-template-columns:1fr}.vs{margin:0 auto}}

/* Modals */
.modal{position:fixed;inset:0;background:#04060bd9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:480px;width:100%;text-align:center;max-height:92vh;overflow:auto;box-shadow:0 30px 80px #000c}
.modal.show .dialog{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.trophy{font-size:72px;line-height:1;animation:trophy 1.2s cubic-bezier(.2,.8,.2,1) both,bob 2s 1.2s ease-in-out infinite}
@keyframes trophy{0%{transform:translateY(-80px) rotate(-30deg) scale(.3);opacity:0}60%{transform:translateY(8px) rotate(8deg) scale(1.15);opacity:1}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.dialog h2{margin:6px 0 6px;font-family:var(--disp);font-weight:400;font-size:clamp(34px,6vw,48px);letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
.dialog p{color:var(--muted);margin:0 0 6px}
.dialog table{width:100%;margin:16px 0;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dialog th,.dialog td{padding:10px 8px;border-bottom:1px solid var(--line)}
.dialog th{color:var(--muted);font-size:12px;font-weight:600}
.dialog td{font-weight:800;font-size:18px}
.dialog td:first-child,.dialog th:first-child{text-align:left}
.dialog tbody tr{animation:rise .5s both}.dialog tbody tr:nth-child(2){animation-delay:.12s}
.dialog tr.win td{color:var(--accent)}
#sheet .dialog{max-width:660px;text-align:left}
#sheet h2{text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tabs button{font-size:13px;padding:7px 11px;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--accent);color:#141414}
#sheetList{columns:2;column-gap:28px;margin:10px 0;padding-left:34px;font-size:15px;line-height:1.7}
#sheetList li.used{color:#5d6370;text-decoration:line-through}
#sheetList li.now{color:#141414;background:var(--accent);font-weight:800;border-radius:6px;padding:0 6px;break-inside:avoid}
@media(max-width:520px){#sheetList{columns:1}}

/* Shared animations */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes picIn{from{opacity:0;transform:scale(.82) rotate(-2deg);filter:blur(18px)}to{opacity:1;transform:none;filter:drop-shadow(0 10px 30px #000a)}}
@keyframes flashOk{0%{box-shadow:inset 0 0 0 0 #3ddc9700}30%{box-shadow:inset 0 0 0 10px #3ddc97,0 0 60px #3ddc9790}100%{box-shadow:inset 0 0 0 0 #3ddc9700}}
@keyframes flashPass{0%,100%{transform:none}20%{transform:translateX(-12px) rotate(-.6deg)}40%{transform:translateX(10px) rotate(.6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes turnIn{0%{transform:scale(.96)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.7) translateY(20px)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes ansUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#home>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#home>*:nth-child(2){animation-delay:.07s}#home>*:nth-child(3){animation-delay:.14s}#home>*:nth-child(4){animation-delay:.21s}#home>*:nth-child(5){animation-delay:.28s}#home>*:nth-child(6){animation-delay:.35s}#home>*:nth-child(7){animation-delay:.42s}
.photo img.in,#textCard.in{animation:picIn .5s cubic-bezier(.2,.8,.2,1)}
.photo.ok{animation:flashOk .6s ease-out}
.photo.no{animation:flashPass .45s ease-out}
#answer.show{animation:ansUp .3s ease-out}
.player.active.turn{animation:turnIn .5s cubic-bezier(.2,.8,.2,1),glowPulse 2s .5s ease-in-out infinite}
.plus{position:absolute;left:50%;top:38%;font-family:var(--disp);font-size:38px;color:var(--ok);pointer-events:none;animation:floatUp .9s ease-out forwards;text-shadow:0 2px 12px #000;z-index:2}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;z-index:5;pointer-events:none;animation:burst .7s ease-out forwards}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div><div class="floor"></div>
<section id="home">
  <div class="brand"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i>THE FLOOR</div>
  <h1>Name it.<span>Beat the clock.</span></h1>

  <div class="card">
    <h2>CONTESTANTS</h2>
    <div class="players">
      <input type="text" id="p1" value="Player 1" maxlength="18" aria-label="Contestant 1">
      <div class="vs">VS</div>
      <input type="text" id="p2" value="Player 2" maxlength="18" aria-label="Contestant 2">
    </div>
    <div class="opts">
      <label>Time each <select id="secs"><option>30</option><option selected>50</option><option>60</option><option>90</option></select> sec</label>
      <label><input type="checkbox" id="reveal" checked> Show answer on pass (−3 sec)</label>
    </div>
  </div>

  <div class="card">
    <h2>PICK A TOPIC</h2>
    <div class="topics" id="topics"></div>
  </div>

  <button class="primary start" id="start">START GAME ▶</button>
  <div class="row">
    <button id="cheat">📋 Host answer sheet</button>
    <button id="reshuffle">🔀 Shuffle order</button>
  </div>
  <div class="keys"><span><kbd>←</kbd> Got it right</span><span><kbd>→</kbd> Pass</span><span><kbd>Space</kbd> Pause</span><span><kbd>D</kbd> Peek answer</span></div>
</section>

<section id="game">
  <div class="stage">
    <div class="meta"><span id="topicName">Topic</span><span id="counter">1 / 1</span></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="photo" id="photoBox">
      <div id="backdrop"></div>
      <img id="pic" alt="Picture prompt">
      <div id="textCard"></div>
      <div id="maskLayer"></div>
      <div id="vignette"></div>
      <div class="overlay show" id="loading"><div class="spinner" id="spinner"></div><div id="loadingMsg">Loading…</div><button id="retry" style="display:none">Try again</button></div>
      <div class="overlay" id="pausedCover">PAUSED</div>
      <div class="overlay" id="count"><span id="countNum">3</span></div>
      <div id="answer"><small>THE ANSWER IS</small><span id="answerText"></span></div>
    </div>
  </div>

/* ---------- Photos ---------- */
const photoCache = new Map();
function getPhoto(it) {
  if (!photoCache.has(it.s)) {
    const p = new Promise(res => {
      const im = new Image(); let done = false;
      const fin = ok => { if (done) return; done = true; clearTimeout(t); if (!ok) photoCache.delete(it.s); res(ok ? it.s : null); };
      const t = setTimeout(() => fin(false), 12000);
      im.onload = () => fin(true); im.onerror = () => fin(false);
      im.referrerPolicy = 'no-referrer'; im.src = it.s;
    });
    photoCache.set(it.s, p);
  }
  return photoCache.get(it.s);
}
function prefetch(from, count) { for (let i = from; i < Math.min(from + count, state.deck.length); i++) if (state.deck[i].s) getPhoto(state.deck[i]); }

/* ---------- Covers over names (movie posters) ---------- */
function imageRect(box, pic) {
  const W = box.clientWidth, H = box.clientHeight, nw = pic.naturalWidth, nh = pic.naturalHeight;
  if (!nw || !nh) return null;
  const s = Math.min(W / nw, H / nh), iw = nw * s, ih = nh * s;
  return { left: (W - iw) / 2, top: (H - ih) / 2, iw, ih };
}
function layoutMask() {
  const layer = $('maskLayer'), pic = $('pic'), it = state.deck[state.index];
  layer.innerHTML = '';
  if (!it || !it.m || state.locked || state.paused || pic.style.display === 'none') return;
  const r = imageRect($('photoBox'), pic); if (!r) return;
  it.m.forEach(b => {
    const d = document.createElement('div');
    d.className = 'cover' + (b[4] ? ' blur' : '');
    const w = b[2] * r.iw, h = b[3] * r.ih;
    d.style.left = (r.left + b[0] * r.iw - 1) + 'px'; d.style.top = (r.top + b[1] * r.ih - 1) + 'px';
    d.style.width = (w + 2) + 'px'; d.style.height = (h + 2) + 'px';
    if (b[4]) d.style.setProperty('--b', 'blur(' + Math.max(8, Math.round(Math.min(w, h) * 0.5)) + 'px)');
    else d.textContent = '?';
    layer.appendChild(d);
  });
}
window.addEventListener('resize', layoutMask);

function coverUrl(name) {
  const c = COVERS[name]; if (!c) return null;
  if (c.startsWith('http')) return c;
  const it = TOPICS[name].find(i => i.l === c); return it ? it.s : null;
}
function renderTopics() {
  const box = $('topics');
  if (!box.children.length) Object.keys(TOPICS).forEach((name, k) => {
    const b = document.createElement('button'), look = LOOK[name] || ['❓', '#2a3350', '#151924'];
    b.className = 'topic'; b.dataset.name = name;
    b.style.setProperty('--g1', look[1]); b.style.setProperty('--g2', look[2]); b.style.animationDelay = (0.25 + k * 0.05) + 's';
    b.innerHTML = '<span class="em">' + look[0] + '</span><span class="lab"></span>';
    b.querySelector('.lab').innerHTML = name + '<small>' + TOPICS[name].length + (name === 'Acronyms' ? ' acronyms' : ' pictures') + '</small>';

    box.appendChild(b);
  });
  [...box.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.name === state.topic));
}

/* ---------- Game ---------- */
function render() {
  for (let i = 0; i < 2; i++) {
    $('n' + i).textContent = state.names[i];
    $('t' + i).textContent = fmt(state.remaining[i]);
    $('t' + i).classList.toggle('low', state.remaining[i] <= 10000);
    $('c' + i).classList.toggle('active', state.turn === i);
    $('s' + i).firstChild.textContent = state.correct[i];
    const bar = $('b' + i); bar.style.width = (state.startMs ? Math.max(0, state.remaining[i] / state.startMs * 100) : 100) + '%'; bar.classList.toggle('low', state.remaining[i] <= 10000);
  }
  $('counter').textContent = Math.min(state.index + 1, state.deck.length) + ' / ' + state.deck.length;
  $('topicName').textContent = state.topic;
  $('prog').style.width = (state.deck.length ? state.index / state.deck.length * 100 : 0) + '%';
  $('vignette').classList.toggle('on', canAct() && state.remaining[state.turn] <= 10000);
  const can = canAct();
  $('correct').disabled = !can; $('pass').disabled = !can;
  $('pause').disabled = !state.playing || state.loading || state.locked || state.counting;
  $('pausedCover').classList.toggle('show', state.paused);
}

    const s = document.createElement('div'), a = Math.PI * 2 * k / 18, r = 140 + Math.random() * 160;

  $('loading').classList.toggle('show', on);
  $('loadingMsg').textContent = msg || 'Loading…';
  $('spinner').style.display = failed ? 'none' : 'block';
  $('retry').style.display = failed ? 'inline-block' : 'none';
  if (on) { $('pic').style.display = 'none'; $('textCard').classList.remove('show'); }
  render(); layoutMask();
}
function tick() {
  const now = performance.now(), dt = Math.min(now - state.last, 500);
  state.last = now;
  if (!state.playing || state.paused || state.loading || state.counting) return;
  state.remaining[state.turn] -= dt;
  if (state.remaining[state.turn] <= 0) { state.remaining[state.turn] = 0; render(); finish('timeout'); return; }
  render();
}
let countTimer = null;
function countdown() {
  const seq = ['3', '2', '1', 'GO!'], game = state.game; let k = 0;
  state.counting = true; $('count').classList.add('show');
  const step = () => {
    if (game !== state.game || !state.playing) return;
    if (k >= seq.length) { $('count').classList.remove('show'); state.counting = false; state.last = performance.now(); if (!state.loading) anim($('pic').style.display === 'block' ? $('pic') : $('textCard'), 'in'); render(); return; }
    $('countNum').textContent = seq[k++]; anim($('count'), 'tick');
    countTimer = setTimeout(step, 700);
  };
  step();
}
function start() {
  state.names = [$('p1').value.trim() || 'Player 1', $('p2').value.trim() || 'Player 2'];
  state.startMs = parseInt($('secs').value, 10) * 1000;
  state.revealOnPass = $('reveal').checked;
  state.deck = planFor(state.topic).slice();
  state.index = 0; state.turn = 0; state.fails = 0;
  state.remaining = [state.startMs, state.startMs]; state.correct = [0, 0];
  state.paused = false; state.locked = false; state.playing = true; state.game++;
  setHost(false);
  clearTimeout(endTimer); $('answer').style.display = 'none';
  $('result').classList.remove('show');
  $('home').style.display = 'none'; $('game').style.display = 'grid'; document.body.classList.add('playing');
  $('pause').innerHTML = 'Ⅱ Pause <kbd>Space</kbd>';
  notice(state.names[0] + ' starts!');
  state.last = performance.now();
  clearInterval(ticker); ticker = setInterval(tick, 100);
  clearTimeout(countTimer); countdown();
  showCurrent();
}
async function showCurrent() {
  const token = ++state.token;
  if (state.index >= state.deck.length) { finish('complete'); return; }
  setLoading(true);
  prefetch(state.index + 1, 4);
  const it = state.deck[state.index];
  if (it.t) {
    state.fails = 0; setHost(false);
    $('backdrop').style.backgroundImage = 'none'; $('pic').style.display = 'none'; $('textCard').textContent = it.t; $('textCard').classList.add('show'); anim($('textCard'), 'in');
    setLoading(false); $('textCard').classList.add('show'); layoutMask(); refreshSheet(); return;
  }
  $('textCard').classList.remove('show');
  const src = await getPhoto(it);
  if (token !== state.token || !state.playing) return;
  if (!src) {
    state.fails++;
    if (state.fails >= 4) { setLoading(true, 'Pictures are not loading. Check your internet, then press Try again. The clock is stopped.', true); return; }
    notice('“' + it.l + '” did not load, so it was skipped.');
    state.deck.splice(state.index, 1);
    showCurrent(); return;
  }
  state.fails = 0;
  setHost(false);
  const pic = $('pic');
  $('backdrop').style.backgroundImage = 'url("' + src + '")';
  pic.onload = layoutMask; pic.src = src; pic.style.display = 'block'; anim(pic, 'in');
  setLoading(false); layoutMask(); refreshSheet();
}
function advance(switchTurn) {
  state.index++;
  if (switchTurn) { state.turn = 1 - state.turn; notice(state.names[state.turn] + ' is up!'); render(); anim($('c' + state.turn), 'turn'); }
  else notice(state.names[state.turn] + ' keeps the turn.');
  render(); showCurrent();
}
const canAct = () => state.playing && !state.paused && !state.loading && !state.locked && !state.counting;
function onCorrect() { if (!canAct()) return; hit('correct'); state.correct[state.turn]++; bump(state.turn); plusOne(state.turn); anim($('photoBox'), 'ok'); sparks(); advance(true); }
function onPass() {
  if (!canAct()) return;
  hit('pass'); anim($('photoBox'), 'no');
  if (!state.revealOnPass) { advance(false); return; }
  const it = state.deck[state.index], game = state.game;
  state.locked = true;
  $('answerText').textContent = it.l; $('answer').style.display = 'block'; $('answer').classList.remove('show'); void $('answer').offsetWidth; $('answer').classList.add('show');
  layoutMask(); notice('Passed. The clock keeps running.'); render();
  endTimer = setTimeout(() => {
    if (game !== state.game || !state.playing) return;
    state.locked = false; $('answer').style.display = 'none'; layoutMask(); advance(false);
  }, PASS_PENALTY_MS);
}
function onPause() {
  if (!state.playing || state.loading || state.locked || state.counting) return;
  state.paused = !state.paused;
  $('pause').innerHTML = (state.paused ? '▶ Resume' : 'Ⅱ Pause') + ' <kbd>Space</kbd>';
  notice(state.paused ? 'Paused.' : 'Resumed.');
  state.last = performance.now(); render(); layoutMask();
}
function finish(reason) {
  if (!state.playing) return;
  state.playing = false; state.locked = false;
  state.token++; clearInterval(ticker); clearTimeout(endTimer); clearTimeout(countTimer);
  state.counting = false; $('count').classList.remove('show'); $('vignette').classList.remove('on');
  $('answer').style.display = 'none';
  replan(state.topic); // next game gets a brand-new random order
  let title, desc;
  if (reason === 'timeout') { title = state.names[1 - state.turn] + ' wins!'; desc = state.names[state.turn] + ' ran out of time.'; }
  else if (reason === 'complete') { const c = state.correct; title = 'All pictures used!'; desc = c[0] === c[1] ? 'It ends level.' : state.names[c[0] > c[1] ? 0 : 1] + ' got the most correct.'; }
  else { title = 'Round ended'; desc = 'Here is where things stood.'; }
  $('resTitle').textContent = title; $('resDesc').textContent = desc;
  $('resRows').innerHTML = '<tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr>';
  [0, 1].forEach(i => { const c = $('resRows').rows[i].cells; c[0].textContent = state.names[i]; c[1].textContent = state.correct[i]; c[2].textContent = fmt(state.remaining[i]); });
  const lead = reason === 'timeout' ? 1 - state.turn : state.correct[0] === state.correct[1] ? -1 : state.correct[0] > state.correct[1] ? 0 : 1;
  [0, 1].forEach(i => $('resRows').rows[i].classList.toggle('win', i === lead));
  $('trophy').textContent = reason === 'ended' ? '🏁' : '🏆';
  $('result').classList.add('show');
  if (reason !== 'ended') confetti();
  render(); refreshSheet(); $('again').focus();
}
function toMenu() { document.body.classList.remove('playing'); renderTopics(); $('result').classList.remove('show'); $('game').style.display = 'none'; $('home').style.display = 'block'; }

/* ---------- Host tools ---------- */
function setHost(open) {
  state.hostOpen = open;
  const it = state.deck[state.index];
  $('host').classList.toggle('open', open && !!it);
  if (open && it) { $('hostText').textContent = it.l; $('hostHint').textContent = 'Host only · D to hide'; $('hostBtn').innerHTML = '🙈 Hide <kbd>D</kbd>'; }
  else { $('hostText').textContent = 'Answer hidden'; $('hostHint').textContent = 'Press D to peek'; $('hostBtn').innerHTML = '👁 Peek <kbd>D</kbd>'; }
}
let sheetTopic = null, hostWin = null;
const label = i => i.t ? i.t + ' = ' + i.l : i.l;
function sheetRows(name) {
  if (state.playing && name === state.topic) return state.deck.map((i, k) => ({ text: label(i), cls: k < state.index ? 'used' : k === state.index ? 'now' : '' }));
  return planFor(name).map((i, k) => ({ text: label(i), cls: k === 0 ? 'now' : '' }));
}
function renderSheet(name) {
  sheetTopic = name;
  $('sheetTabs').innerHTML = '';
  Object.keys(TOPICS).forEach(n => {
    const b = document.createElement('button'); b.textContent = n; b.setAttribute('aria-pressed', n === name);
    b.onclick = () => renderSheet(n); $('sheetTabs').appendChild(b);
  });
  $('sheetHint').textContent = state.playing && name === state.topic ? 'Live: the highlighted answer is on screen now.' : 'The order the pictures will come up in the next ' + name + ' game.';
  const list = $('sheetList'); list.innerHTML = '';
  let now = null;
  sheetRows(name).forEach(r => { const li = document.createElement('li'); li.textContent = r.text; li.className = r.cls; list.appendChild(li); if (r.cls === 'now') now = li; });
  if (now && state.playing) now.scrollIntoView({ block: 'center' });
  renderHostWin();
}
function renderHostWin() {
  if (!hostWin || hostWin.closed) return;
  const name = state.playing ? state.topic : (sheetTopic || state.topic), rows = sheetRows(name);
  const cur = rows.find(r => r.cls === 'now');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  hostWin.document.body.innerHTML =
    '<h1>' + esc(name) + '</h1><div class="cur"><small>' + (state.playing ? 'ON SCREEN NOW' : 'FIRST UP') + '</small>' + esc(cur ? cur.text : '—') + '</div>' +
    '<ol>' + rows.map(r => '<li class="' + r.cls + '">' + esc(r.text) + '</li>').join('') + '</ol>';
  const n = hostWin.document.querySelector('li.now'); if (n) n.scrollIntoView({ block: 'center' });
}
function openHostWin() {
  hostWin = window.open('', 'floorHostSheet', 'width=440,height=820');
  if (!hostWin) { alert('Your browser blocked the window. Allow pop-ups for this file and try again.'); return; }
  hostWin.document.title = 'Host answers';
  const st = hostWin.document.createElement('style');
  st.textContent = 'body{margin:0;padding:16px;background:#0f1115;color:#f3f4f6;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif}h1{margin:0 0 8px;color:#ffcc33;font-size:20px}.cur{position:sticky;top:0;background:#ffcc33;color:#141414;font-weight:900;font-size:26px;padding:10px 14px;border-radius:10px;margin-bottom:10px}.cur small{display:block;font-size:11px;letter-spacing:1px}ol{padding-left:34px}li.used{color:#5d6370;text-decoration:line-through}li.now{background:#ffcc33;color:#141414;font-weight:900;border-radius:6px;padding:0 6px}';
  hostWin.document.head.appendChild(st);
  renderHostWin();
}
function refreshSheet() { if ($('sheet').classList.contains('show') && sheetTopic) renderSheet(sheetTopic); else renderHostWin(); }
function openSheet() { renderSheet(state.topic); $('sheet').classList.add('show'); $('sheetClose').focus(); }
const closeSheet = () => $('sheet').classList.remove('show');

/* ---------- Wiring ---------- */
let endArmed = false, endArmTimer = null;
$('start').onclick = start;
$('cheat').onclick = openSheet;
$('reshuffle').onclick = () => { replan(state.topic); refreshSheet(); notice(''); $('reshuffle').textContent = '🔀 Shuffled!'; setTimeout(() => { $('reshuffle').textContent = '🔀 Shuffle order'; }, 1200); };
$('sheetClose').onclick = closeSheet;
$('sheetPop').onclick = () => { closeSheet(); openHostWin(); };
$('hostBtn').onclick = e => { e.currentTarget.blur(); setHost(!state.hostOpen); };
$('correct').onclick = e => { e.currentTarget.blur(); onCorrect(); };
$('pass').onclick = e => { e.currentTarget.blur(); onPass(); };
$('pause').onclick = e => { e.currentTarget.blur(); onPause(); };
$('end').onclick = e => {
  e.currentTarget.blur();
  if (!endArmed) { endArmed = true; $('end').textContent = 'Tap again to end'; endArmTimer = setTimeout(() => { endArmed = false; $('end').textContent = 'End round'; }, 3000); return; }
  clearTimeout(endArmTimer); endArmed = false; $('end').textContent = 'End round'; finish('ended');
};
$('retry').onclick = () => { state.fails = 0; state.last = performance.now(); showCurrent(); };
$('again').onclick = start;
$('menu').onclick = toMenu;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (!state.playing || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowLeft') { e.preventDefault(); onCorrect(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); onPass(); }
  else if (e.key === ' ') { e.preventDefault(); hit('pause'); onPause(); }
  else if (k === 'd') setHost(!state.hostOpen);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && canAct()) onPause(); });
renderTopics();
</script>
</body>
